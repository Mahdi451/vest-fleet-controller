<rect x="385" y="127" width="355" height="115" rx="12" class="box"/>
<text x="405" y="161" class="label">VALIDATE + JOURNAL</text>
<text x="405" y="198" class="heading">Journal command IDs</text>
<text x="405" y="225" class="small">Identity · armed limits · risk · hedge guard</text>
<path d="M740 185 H806" class="line" marker-end="url(#arrow)"/>
<rect x="815" y="127" width="345" height="115" rx="12" class="box"/>
<text x="835" y="161" class="label">FAST FAN-OUT</text>
<text x="835" y="198" class="heading">Prepared contexts</text>
<text x="835" y="225" class="small">No waiting for another follower's fill</text>
