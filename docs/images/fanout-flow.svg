<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Planned event-driven copier architecture</title>
<desc id="desc">Account 01 events are validated and journaled, then sent to independent followers 02 through 10. Outcomes are monitored separately. Local failures remain isolated; global integrity failures stop new events. Connected execution is pending.</desc>
<defs><style>
text {font-family:Arial,Helvetica,sans-serif;fill:#edf3f7}
.small {font-size:16px;fill:#afbbc8}
.label {font-size:14px;letter-spacing:1.3px;fill:#5ee3ba;font-weight:700}
.heading {font-size:24px;font-weight:700}
.box {fill:#111e2a;stroke:#344659;stroke-width:1.5}
.line {fill:none;stroke:#5ee3ba;stroke-width:2}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5ee3ba"/></marker></defs>
<rect width="1200" height="650" rx="18" fill="#0b1118"/>
<text x="40" y="46" class="label">VEST FLEET CONTROLLER</text>
<text x="1160" y="46" class="small" text-anchor="end">PLANNED ARCHITECTURE · LIVE LOCKED</text>
<text x="40" y="94" font-size="34" font-weight="700">One leader event. Independent followers.</text>
<rect x="40" y="127" width="275" height="115" rx="12" class="box"/>
<text x="60" y="161" class="label">ACCOUNT 01 · LEADER</text>
<text x="60" y="198" class="heading">New leader event</text>
<text x="60" y="225" class="small">Not a position snapshot</text>
