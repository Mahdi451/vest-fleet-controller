<text x="1104" y="387" text-anchor="middle" class="small">Independent</text>
<path d="M1104 418 V455" class="line"/>
<path d="M96 455 H1104 M600 455 V478" class="line" marker-end="url(#arrow)"/>
<rect x="40" y="487" width="1120" height="87" rx="12" class="box"/>
<text x="60" y="521" class="label">MONITOR EACH FOLLOWER</text>
<text x="60" y="553" font-size="20">Fill + price · Stop · Target · Exposure · Error · Safe repair eligibility · Measured latency</text>
<text x="40" y="610" class="small">Local failure → flag that follower. Global integrity or fleet-risk failure → stop new events.</text>
<text x="40" y="635" class="small">UNKNOWN → reconcile, never blind retry. Follower exit → no automatic reopening.</text>
</svg>
